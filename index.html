<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeadGenius AI – Turn Every Lead Into Your Next Customer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300F5FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'></polygon></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            navy: {
              950: '#030712',
              900: '#060B18',
              850: '#0A1024',
              800: '#0F172A',
              750: '#141E36',
              700: '#1E293B',
              600: '#334155',
            },
            electric: {
              300: '#C4B5FD',
              400: '#A78BFA',
              500: '#8B5CF6',
              600: '#7C3AED',
              700: '#6D28D9',
            },
            cyan: {
              300: '#67E8F9',
              400: '#22D3EE',
              500: '#06B6D4',
              accent: '#00F5FF',
            },
          },
          boxShadow: {
            'glow-purple': '0 0 40px -8px rgba(139, 92, 246, 0.45)',
            'glow-cyan': '0 0 40px -8px rgba(0, 245, 255, 0.35)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.55)',
            'inner-glow': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.1)',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-subtle': 'pulseSubtle 3s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: 0.6, transform: 'scale(1)' },
              '50%': { opacity: 1, transform: 'scale(1.03)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #060B18;
    }
    ::-webkit-scrollbar-thumb {
      background: #1E293B;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Glassmorphic Utilities */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card-hover {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card-hover:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 245, 255, 0.3);
      box-shadow: 0 12px 30px -10px rgba(124, 58, 237, 0.25);
    }
    .glass-panel {
      background: rgba(10, 16, 36, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Gradient Text & Borders */
    .gradient-text-electric {
      background: linear-gradient(135deg, #FFFFFF 0%, #C4B5FD 40%, #00F5FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .gradient-border-purple {
      position: relative;
    }
    .gradient-border-purple::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.6), rgba(0, 245, 255, 0.3), transparent 60%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Grid background pattern */
    .bg-grid-pattern {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }
  </style>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-navy-950 text-slate-100 antialiased selection:bg-electric-500 selection:text-white min-h-screen">
  <div id="root">
    <!-- Polished loading state -->
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-navy-950">
      <div class="relative w-16 h-16 mb-4">
        <div class="absolute inset-0 rounded-full border-2 border-electric-500/20 animate-ping"></div>
        <div class="w-16 h-16 rounded-full border-2 border-transparent border-t-cyan-accent border-r-electric-500 animate-spin"></div>
        <div class="absolute inset-2 bg-navy-900 rounded-full flex items-center justify-center">
          <svg class="w-6 h-6 text-cyan-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polygon></svg>
        </div>
      </div>
      <p class="text-sm font-medium tracking-wider text-slate-400 uppercase">Loading LeadGenius AI...</p>
    </div>
  </div>

  <!-- Unified React Application -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
